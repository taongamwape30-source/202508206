plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'

}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)

    }
}

javafx {
    version = '17.0.10'
    modules = [ 'javafx.controls']
}

application {
    mainModule = 'com.example.hellofx'
    mainClass = 'com.example.hellofx.HelloJavaFX'
}

